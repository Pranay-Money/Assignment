<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="text-center mb-4">Student Directory</h2>
        <div class="input-group mb-4">
            <input type="text" id="search" class="form-control" placeholder="Search Student">
            <button class="btn btn-primary" onclick="searchStudent()">Search</button>
            <button class="btn btn-secondary" onclick="displayStudents()">Reset</button>
        </div>
        <div class="row" id="cards"></div>
    </div>

    <script>
        let students = [];
        fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(data => {
            students = data;
            displayStudents(students);
        });

        function displayStudents(list){
            let html = "";
            list.forEach((s,i)=>{
                html += `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>${s.name}</h5>
                            <button class="btn btn-success btn-sm mb-2" onclick="toggleDetails(${i})">
                                Show Details
                            </button>
                            <div id="details${i}" style="display:none;">
                                <p><b>Email:</b> ${s.email}</p>
                                <p><b>Phone:</b> ${s.phone}</p>
                                <p><b>Website:</b> ${s.website}</p>
                                <p><b>Company:</b> ${s.company.name}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById("cards").innerHTML = html;
        }

        function toggleDetails(i){
            $("#details"+i).slideToggle();
        }

        function searchStudent(){
            let value = document
                .getElementById("search")
                .value
                .toLowerCase();
            let result = students.filter(student =>
                student.name.toLowerCase().includes(value)
            );
            displayStudents(result);
        }
    </script>
</body>
</html>
